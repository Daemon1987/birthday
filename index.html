<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Happy Birthday, Miniso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="glitter-canvas"></div>
<div id="banner" class="banner hidden"></div>

<!-- Passcode gate (set CONFIG.passcode to "" in script.js to turn it off) -->
<div id="gate" class="gate hidden">
  <form id="gateForm" class="gate-card" autocomplete="off">
    <div class="gate-heart">&hearts;</div>
    <h1 id="gateTitle">For Miniso</h1>
    <p id="gateHint" class="gate-hint"></p>
    <input id="gateInput" type="text" inputmode="numeric" placeholder="Enter the secret code" aria-label="Secret code">
    <button type="submit" class="gate-btn">Open</button>
    <p id="gateErr" class="gate-err"></p>
  </form>
</div>

<div id="stage" class="stage hidden">
  <div class="book" id="book"></div>
  <div class="controls">
    <button id="prevBtn" class="ctl" aria-label="Previous page">&lsaquo;</button>
    <span id="pageNum">1 / 1</span>
    <button id="nextBtn" class="ctl" aria-label="Next page">&rsaquo;</button>
  </div>
  <div class="hint">Tap the right side, swipe, or use the arrows to turn the page</div>
</div>

<button id="musicBtn" class="music hidden" aria-label="Toggle music">&#9834;</button>
<audio id="bgm" loop preload="none"></audio>

<script src="script.js"></script>
</body>
</html>
